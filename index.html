<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>conte-rush</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-state="idle">
    <header class="toolbar">
      <h1>conte-rush</h1>
      <label class="file-picker">
        PDFを選択
        <input id="pdf-input" type="file" accept="application/pdf" />
      </label>
      <p id="file-name" class="file-name"></p>
    </header>

    <main class="app">
      <p id="status" class="status" role="status">PDFファイルを選択してください</p>

      <div class="workspace">
        <div class="stage-column">
          <section class="viewer" aria-label="PDF表示">
            <div class="viewer-main">
              <div class="page-stage">
                <canvas id="pdf-canvas"></canvas>
                <div id="panel-overlay" class="panel-overlay"></div>
              </div>
            </div>
            <nav class="pager" aria-label="ページ操作">
              <button id="prev-page" type="button" disabled>前へ</button>
              <span id="page-info" class="page-info"></span>
              <button id="next-page" type="button" disabled>次へ</button>
            </nav>
            <div class="panel-place-bar">
              <div class="place-modes" role="group" aria-label="Panel登録モード">
                <button id="place-mode-drag" type="button" aria-pressed="true">
                  ドラッグで作る
                </button>
                <button id="place-mode-stamp" type="button" aria-pressed="false" disabled>
                  前回サイズで置く
                </button>
              </div>
              <div id="panel-size-fields" class="panel-size-fields" hidden>
                <label>
                  幅 %
                  <input
                    id="panel-width-percent"
                    type="number"
                    min="1"
                    max="100"
                    step="1"
                  />
                </label>
                <label>
                  高さ %
                  <input
                    id="panel-height-percent"
                    type="number"
                    min="1"
                    max="100"
                    step="1"
                  />
                </label>
              </div>
              <div class="stamp-actions">
                <button id="stamp-commit" type="button" disabled>この位置で登録</button>
                <button id="stamp-cancel" type="button" disabled>やめる</button>
              </div>
            </div>
          </section>

          <section
            id="cut-timeline-strip"
            class="cut-timeline-strip"
            aria-label="横Timeline"
          >
            <p data-role="empty" class="cut-timeline-empty">
              Cut一覧から編集するCutを選んでください
            </p>
            <div data-role="body" hidden>
              <div class="cut-timeline-head">
                <p data-role="meta" class="cut-timeline-meta"></p>
                <p data-role="status" class="cut-timeline-status"></p>
              </div>
              <div class="cut-timeline-ruler">
                <span>0f</span>
                <span data-role="end"></span>
              </div>
              <div data-role="track" class="cut-timeline-track"></div>
              <ul data-role="ranges" class="cut-timeline-ranges"></ul>
            </div>
          </section>

          <section class="rush" id="rush-panel" aria-label="Rush">
            <div class="rush-frame">
              <p id="rush-placeholder" class="rush-placeholder">未準備</p>
              <img id="rush-image" alt="Rush の現在 Panel" hidden />
            </div>
            <div class="rush-info">
              <p id="rush-status" class="rush-status">未準備</p>
              <p id="rush-cut" class="rush-cut"></p>
              <p id="rush-local" class="rush-meter"></p>
              <p id="rush-global" class="rush-meter"></p>
              <p id="rush-message" class="rush-message" role="status"></p>
              <div class="rush-actions">
                <button id="rush-reset" type="button">先頭へ戻る</button>
                <button id="rush-play" type="button">Play</button>
                <button id="rush-pause" type="button">Pause</button>
              </div>
            </div>
          </section>
        </div>

        <aside class="right-sidebar">
          <section class="panel-sidebar" aria-label="Panel一覧">
            <p id="panel-counts" class="panel-counts">全0件 / このページ0件</p>
            <ul id="panel-list" class="panel-list"></ul>
          </section>

          <section class="cut-sidebar" aria-label="Cut">
            <h2>新規 Cut</h2>
            <form id="cut-form" class="cut-form">
              <label>
                CUT番号
                <span class="field-with-clear">
                  <input id="cut-number-input" type="text" autocomplete="off" />
                  <button
                    id="cut-number-clear"
                    type="button"
                    class="field-clear"
                    aria-label="CUT番号をクリア"
                  >
                    ×
                  </button>
                </span>
              </label>
              <label>
                尺（秒+コマ）
                <span class="field-with-clear">
                  <input
                    id="cut-duration-input"
                    type="text"
                    placeholder="3+12"
                    autocomplete="off"
                  />
                  <button
                    id="cut-duration-clear"
                    type="button"
                    class="field-clear"
                    aria-label="尺をクリア"
                  >
                    ×
                  </button>
                </span>
              </label>
              <button id="cut-submit" type="submit">この選択でCutを作成</button>
            </form>
            <p id="cut-message" class="cut-message" role="status"></p>
            <ul id="cut-list" class="cut-list"></ul>
            <section id="cut-detail" class="cut-detail" aria-label="Cut編集">
              <h2 id="cut-detail-title">Cut編集</h2>
              <p id="cut-detail-empty" class="cut-detail-empty">一覧からCutを選んでください</p>
              <div id="cut-detail-body" hidden>
                <form id="cut-detail-form" class="cut-form">
                  <label>
                    CUT番号
                    <span class="field-with-clear">
                      <input id="detail-cut-number-input" type="text" autocomplete="off" />
                      <button
                        id="detail-cut-number-clear"
                        type="button"
                        class="field-clear"
                        aria-label="CUT番号をクリア"
                      >
                        ×
                      </button>
                    </span>
                  </label>
                  <label>
                    尺（秒+コマ）
                    <span class="field-with-clear">
                      <input
                        id="detail-cut-duration-input"
                        type="text"
                        placeholder="3+12"
                        autocomplete="off"
                      />
                      <button
                        id="detail-cut-duration-clear"
                        type="button"
                        class="field-clear"
                        aria-label="尺をクリア"
                      >
                        ×
                      </button>
                    </span>
                  </label>
                  <button id="cut-detail-save" type="submit">変更を保存</button>
                </form>
                <div class="cut-detail-actions">
                  <button id="cut-add-selected" type="button">選択Panelを追加</button>
                  <button id="cut-delete" type="button">Cutを削除</button>
                </div>
                <p class="cut-detail-label">所属 Panel</p>
                <ul id="cut-members" class="cut-members"></ul>
                <section id="timeline-editor" class="timeline-editor" aria-label="Timeline">
                  <div class="timeline-editor-head">
                    <h2>Timeline</h2>
                  </div>
                  <div id="timeline-meta" class="timeline-meta"></div>
                  <p id="timeline-status" class="timeline-status"></p>
                  <ul id="timeline-rows" class="timeline-rows"></ul>
                  <p class="timeline-confirm-label">確認</p>
                  <ul id="timeline-ranges" class="timeline-ranges"></ul>
                  <p id="timeline-message" class="timeline-message" role="status"></p>
                </section>
              </div>
            </section>
          </section>
        </aside>
      </div>
    </main>

    <script>
      window.addEventListener("error", (event) => {
        const status = document.getElementById("status");
        if (!status || !event.message) {
          return;
        }
        const file = String(event.filename || "");
        if (file && !file.includes("/js/")) {
          return;
        }
        status.textContent = `起動エラー: ${event.message}`;
      });
    </script>
    <script type="module" src="js/app.js?v=m52-1"></script>
  </body>
</html>
