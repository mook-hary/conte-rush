<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>conte-rush</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-state="idle">
    <header class="toolbar">
      <h1>conte-rush</h1>
      <label class="file-picker">
        PDFを選択
        <input id="pdf-input" type="file" accept="application/pdf" />
      </label>
      <p id="file-name" class="file-name"></p>
    </header>

    <main class="app">
      <p id="status" class="status" role="status">PDFファイルを選択してください</p>

      <div class="workspace">
        <div class="stage-column">
          <section class="viewer" aria-label="PDF表示">
            <div class="page-stage">
              <canvas id="pdf-canvas"></canvas>
              <div id="panel-overlay" class="panel-overlay"></div>
            </div>
          </section>

          <section class="rush" id="rush-panel" aria-label="Rush">
            <div class="rush-frame">
              <p id="rush-placeholder" class="rush-placeholder">未準備</p>
              <img id="rush-image" alt="Rush の現在 Panel" hidden />
            </div>
            <div class="rush-info">
              <p id="rush-status" class="rush-status">未準備</p>
              <p id="rush-cut" class="rush-cut"></p>
              <p id="rush-local" class="rush-meter"></p>
              <p id="rush-global" class="rush-meter"></p>
              <p id="rush-message" class="rush-message" role="status"></p>
              <div class="rush-actions">
                <button id="rush-reset" type="button">先頭へ戻る</button>
                <button id="rush-play" type="button">Play</button>
                <button id="rush-pause" type="button">Pause</button>
              </div>
            </div>
          </section>
        </div>

        <aside class="right-sidebar">
          <section class="panel-sidebar" aria-label="Panel一覧">
            <p id="panel-counts" class="panel-counts">全0件 / このページ0件</p>
            <ul id="panel-list" class="panel-list"></ul>
          </section>

          <section class="cut-sidebar" aria-label="Cut">
            <h2>Cut</h2>
            <form id="cut-form" class="cut-form">
              <label>
                CUT番号
                <input id="cut-number-input" type="text" autocomplete="off" />
              </label>
              <label>
                尺（秒+コマ）
                <input
                  id="cut-duration-input"
                  type="text"
                  placeholder="3+12"
                  autocomplete="off"
                />
              </label>
              <button id="cut-submit" type="submit">この選択でCutを作成</button>
              <button id="cut-cancel-edit" type="button" hidden>編集をやめる</button>
            </form>
            <p id="cut-message" class="cut-message" role="status"></p>
            <ul id="cut-list" class="cut-list"></ul>
            <section id="timeline-editor" class="timeline-editor" hidden aria-label="Timeline">
              <div class="timeline-editor-head">
                <h2>Timeline</h2>
                <button id="timeline-close" type="button">閉じる</button>
              </div>
              <div id="timeline-meta" class="timeline-meta"></div>
              <p id="timeline-status" class="timeline-status"></p>
              <ul id="timeline-rows" class="timeline-rows"></ul>
              <p class="timeline-confirm-label">確認</p>
              <ul id="timeline-ranges" class="timeline-ranges"></ul>
              <p id="timeline-message" class="timeline-message" role="status"></p>
            </section>
          </section>
        </aside>
      </div>

      <nav class="pager" aria-label="ページ操作">
        <button id="prev-page" type="button" disabled>前へ</button>
        <span id="page-info" class="page-info"></span>
        <button id="next-page" type="button" disabled>次へ</button>
      </nav>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
